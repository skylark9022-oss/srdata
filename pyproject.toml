[project]
name = "srdata"
version = "0.1.0"
description = "국가 참조표준 데이터 구축을 위한 데이터 수집·분석"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["srdata*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
